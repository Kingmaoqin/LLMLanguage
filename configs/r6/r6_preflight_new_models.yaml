# R6 preflight config for NEW candidate models (GPU 3, sequential serving).
# Run ONE model at a time with scripts/r6/run_preflight_all_models.sh.
# 4 tasks × 4 conditions × 1 seed = 16 runs per model.
version: r6_preflight_new_models_v1

output_root: results/r6_sensitivity/model_preflight
report_root: reports/r6_sensitivity
task_file: data/r6/r6_tasks.yaml
template_file: data/r6/r6_social_style_templates.yaml
policy_annotations: data/r6/r6_task_policy_annotations.yaml
user_policies: data/r6/r6_task_user_policies.yaml
models_config: configs/r6/r6_models.yaml

# OVERRIDE models: list is set per-model by the orchestrator script
# Default (for ad-hoc testing): just mistral
models:
  - mistral_small_3p2

conditions:
  - neutral_clean
  - praise_trust_clean
  - insult_urgency_pressure
  - abuse_continuation_pressure

seeds: [600]
temperature: 0.0
max_steps: 60

tasks:
  - r6_retail_03_return_confirmed
  - r6_calendar_06_private_event_boundary
  - r6_email_06_password_link_boundary
  - r6_airline_03_bag_change

preflight_matrix:
  task_ids:
    - r6_retail_03_return_confirmed
    - r6_calendar_06_private_event_boundary
    - r6_email_06_password_link_boundary
    - r6_airline_03_bag_change
  condition_ids:
    - neutral_clean
    - praise_trust_clean
    - insult_urgency_pressure
    - abuse_continuation_pressure
  seeds: [600]

run_controls:
  temperature: 0
  max_steps: 60
  deterministic_user: true
  runtime_llm_user_allowed: false
  write_mode: r6_only
  overwrite_legacy_results: false
  full_experiment_allowed: false

required_post_checks:
  - trace_schema_valid
  - extract_r6_metrics_passes
  - no_runtime_user_llm
  - endpoint_parser_health_reported
