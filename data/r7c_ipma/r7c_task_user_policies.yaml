  provides_confirmation_if_requested: true
  confirmation_scope: exchange_delivered_order_items
- task_id: r6_retail_08_prohibited_cancel_boundary
  policy_type: boundary_refusal
  provides_confirmation_if_requested: true
  confirmation_scope: return_delivered_order_items
  never_authorize_tools:
  - cancel_pending_order
